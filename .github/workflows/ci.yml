name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/**

permissions:
  contents: read

jobs:
  validation:
    name: Node ${{ matrix.node-version }} validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package.json
            apps/ui/package.json
            plugins/claude-code/agent-board-core/package.json
            plugins/providers/copilot/package.json

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install core dependencies
        run: npm --prefix plugins/claude-code/agent-board-core install --legacy-peer-deps

      - name: Install UI dependencies
        run: npm --prefix apps/ui install --legacy-peer-deps

      - name: Core lint and formatting
        run: npm run lint && npm --prefix plugins/claude-code/agent-board-core run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Database migration verification
        run: npm run verify:db-migrations

      - name: Architecture boundaries
        run: npm run test:architecture

      - name: Verify generated provider bundle freshness
        # build-provider-bundles.mjs writes into the core's src/generated/ —
        # that is the tree a stale bundle shows up in, so that is what we diff.
        run: npm run build:provider-bundles && git diff --exit-code plugins/claude-code/agent-board-core/src/generated/

      - name: UI package freshness
        # Gating (no continue-on-error), but Linux-only on purpose.
        #
        # The check compares a stamp of the apps/ui source blob ids against the
        # stamp recorded when the committed dist was packaged, so it catches the
        # real failure mode: UI source changed, dist not repackaged. Vite output
        # itself is not reproducible across the matrix, and git on the Windows
        # runner derives different blob ids for the same tracked sources than
        # Linux/macOS do — so running this on all three OSes reintroduces the
        # flakiness the check exists to remove. One gating runner is enough:
        # staleness is a property of the commit, not of the OS.
        if: runner.os == 'Linux'
        run: npm run check:ui-dist

      - name: Build
        run: npm run build
