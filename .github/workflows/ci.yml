name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/**

permissions:
  contents: read

jobs:
  validation:
    name: Node ${{ matrix.node-version }} validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package.json
            plugins/claude-code/agent-board-core/package.json

      - name: Install root dependencies
        run: npm install --legacy-peer-deps

      - name: Install core dependencies
        run: npm --prefix plugins/claude-code/agent-board-core install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Architecture boundaries
        run: npm run test:architecture

      - name: Build
        run: npm run build
